<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolsa de Plástico — Simulación Física XPBD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 288px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 14px 16px;
      font-size: 12px;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .hud-panel.collapsed {
      width: auto;
      padding: 10px 14px;
    }
    .hud-panel.collapsed .hud-body {
      display: none;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hud-panel.collapsed .hud-header {
      margin-bottom: 0;
    }
    .hud-title {
      font-weight: 650;
      font-size: 13px;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .hud-subtitle {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 1px;
    }
    .toggle-btn {
      background: rgba(15, 23, 42, 0.06);
      border: none;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }
    .toggle-btn:hover { background: rgba(15, 23, 42, 0.12); }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .action-btn {
      background: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11.2px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #38bdf8;
      color: #0284c7;
    }
    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .action-btn.primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
      grid-column: span 2;
    }
    .action-btn.primary:hover:not(:disabled) {
      background: #0369a1;
      color: #ffffff;
    }
    .action-btn.stl-ready {
      background: #0f766e;
      border-color: #0f766e;
      color: #ffffff;
    }
    .action-btn.stl-ready:hover:not(:disabled) {
      background: #115e59;
      color: #ffffff;
    }
    .control-row {
      margin-bottom: 9px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 550;
      color: #475569;
      margin-bottom: 3px;
    }
    .control-label span:last-child {
      font-variant-numeric: tabular-nums;
      color: #0f172a;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #0284c7;
      cursor: pointer;
      height: 4px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.22);
      font-size: 11.5px;
      color: #334155;
    }
    .stats-bar {
      position: absolute;
      left: 16px;
      bottom: 14px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 11px;
      color: #475569;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud-panel" id="hudPanel">
      <div class="hud-header">
        <div>
          <div class="hud-title">Física Bolsa HDPE</div>
          <div class="hud-subtitle">Lámina Delgada XPBD + Plasticidad</div>
        </div>
        <button class="toggle-btn" id="toggleHudBtn">Ocultar</button>
      </div>
      <div class="hud-body">
        <div class="btn-grid">
          <button class="action-btn primary" id="btnRefPose">Re-simular Pose de Referencia</button>
          <button class="action-btn" id="btnWrinkleMode">Pincel Arrugas: NO</button>
          <button class="action-btn" id="btnCrumple">Arrugar y Soltar</button>
          <button class="action-btn" id="btnShake">Ráfaga de Aire</button>
          <button class="action-btn" id="btnFlat">Reiniciar Plana</button>
          <button class="action-btn" id="btnPause">Pausar (Espacio)</button>
          <button class="action-btn" id="btnDownloadStl" disabled title="Pausa la simulación (Espacio) para descargar el STL">Descargar STL</button>
        </div>

        <div class="control-row">
          <div class="control-label"><span>Velocidad de Simulación</span><span id="valSpeed">1.00x</span></div>
          <input type="range" id="sliderSpeed" min="0.05" max="1.50" step="0.05" value="1.00" />
        </div>
        <div class="control-row">
          <div class="control-label"><span>Rigidez de Doblez</span><span id="valBend">0.06</span></div>
          <input type="range" id="sliderBend" min="0.01" max="1.0" step="0.01" value="0.06" />
        </div>
        <div class="control-row">
          <div class="control-label"><span>Memoria de Pliegues</span><span id="valPlastic">0.88</span></div>
          <input type="range" id="sliderPlastic" min="0.0" max="1.0" step="0.02" value="0.88" />
        </div>
        <div class="control-row">
          <div class="control-label"><span>Resistencia del Aire</span><span id="valDrag">0.55</span></div>
          <input type="range" id="sliderDrag" min="0.0" max="1.5" step="0.05" value="0.55" />
        </div>
        <div class="control-row">
          <div class="control-label"><span>Presión de Aire Interna</span><span id="valPressure">0.00</span></div>
          <input type="range" id="sliderPressure" min="-0.3" max="0.8" step="0.02" value="0.00" />
        </div>
        <div class="control-row">
          <div class="control-label"><span>Gravedad</span><span id="valGravity">9.8</span></div>
          <input type="range" id="sliderGravity" min="0" max="18" step="0.2" value="9.8" />
        </div>

        <div class="checkbox-row">
          <label for="chkSelfCol">Autocolisión</label>
          <input type="checkbox" id="chkSelfCol" checked />
        </div>
        <div class="checkbox-row">
          <label for="chkWireframe">Malla (Wireframe)</label>
          <input type="checkbox" id="chkWireframe" />
        </div>
      </div>
    </div>
    <div class="stats-bar" id="statsBar">
      Arrastra la bolsa para tirar • Espacio: Pausar • Órbita: Arrastrar fuera • Zoom: Rueda
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
