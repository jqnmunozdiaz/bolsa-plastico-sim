<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolsa de Plástico — Simulación Física XPBD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --line: rgba(148, 163, 184, 0.22);
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --accent-soft: #e0f2fe;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      user-select: none;
    }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ---------- Panel ---------- */
    .hud-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 380px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 12px 14px 14px;
      font-size: 12px;
      z-index: 10;
    }
    .hud-panel.collapsed { width: auto; padding: 10px 14px; }
    .hud-panel.collapsed .hud-body { display: none; }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hud-panel.collapsed .hud-header { margin-bottom: 0; }
    .hud-title { font-weight: 650; font-size: 13px; color: var(--ink); letter-spacing: -0.01em; }
    .hud-subtitle { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
    .toggle-btn {
      background: rgba(15, 23, 42, 0.06);
      border: none;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .toggle-btn:hover { background: rgba(15, 23, 42, 0.12); }

    /* ---------- Buttons ---------- */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-row + .btn-row { margin-top: 6px; }
    .action-btn {
      background: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11.2px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .action-btn:hover:not(:disabled) { background: #f8fafc; border-color: #38bdf8; color: var(--accent); }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .action-btn.primary:hover:not(:disabled) { background: var(--accent-dark); color: #fff; }
    .action-btn.toggled { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
    .action-btn.wide { width: 100%; }
    .action-btn.stl-ready { background: #0f766e; border-color: #0f766e; color: #fff; }
    .action-btn.stl-ready:hover:not(:disabled) { background: #115e59; color: #fff; }
    .kbd {
      display: inline-block;
      margin-left: 4px;
      padding: 0 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 9.5px;
      font-weight: 600;
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin: 12px 0 4px;
      padding: 3px;
      background: rgba(15, 23, 42, 0.05);
      border-radius: 9px;
    }
    .tabs button {
      border: none;
      background: transparent;
      border-radius: 7px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.active { background: #fff; color: var(--accent-dark); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1); }
    .tab-pane[hidden] { display: none; }
    .section-title {
      margin: 10px 0 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    /* ---------- Control rows ---------- */
    .ctl { padding: 7px 0; border-top: 1px solid var(--line); }
    .tab-pane > .ctl:first-child, .section-title + .ctl { border-top: none; }
    .ctl-head {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      margin-bottom: 3px;
    }
    .ctl-check .ctl-head { margin-bottom: 0; }
    .ctl-head label, .ctl-name { font-size: 11.5px; font-weight: 600; color: var(--text); }
    .ctl-check .ctl-head label { cursor: pointer; }
    .ctl-hint { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
    .ctl-right, .ctl-val {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 3px;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 650;
      font-size: 11px;
    }
    .ctl-num {
      width: 56px;
      padding: 2px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: rgba(15, 23, 42, 0.05);
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      color: var(--ink);
      text-align: right;
      -moz-appearance: textfield;
    }
    .ctl-num::-webkit-inner-spin-button, .ctl-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .ctl-num:hover { border-color: rgba(148, 163, 184, 0.5); }
    .ctl-num:focus { outline: none; border-color: var(--accent); background: #fff; }
    .ctl-unit { min-width: 26px; font-size: 10.5px; font-weight: 500; color: var(--muted); }
    .info-btn {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid #94a3b8;
      background: transparent;
      color: var(--muted);
      font: italic 700 9.5px/13px Georgia, "Times New Roman", serif;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .info-btn:hover, .info-btn.open { border-color: var(--accent); color: #fff; background: var(--accent); }
    .reset-btn {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      line-height: 18px;
      cursor: pointer;
      padding: 0;
      visibility: hidden;
    }
    .reset-btn.visible { visibility: visible; }
    .reset-btn:hover { background: var(--accent-soft); }
    .ctl-info {
      margin: 4px 0 6px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #f1f5f9;
      border-left: 3px solid var(--accent);
      font-size: 11px;
      line-height: 1.42;
      color: #475569;
      user-select: text;
    }
    .ctl-info[hidden] { display: none; }
    .ctl-info b { font-weight: 650; color: var(--text); }
    .ctl-check input[type="checkbox"] { margin-left: auto; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 4px; display: block; }
    input[type="range"]:disabled { cursor: not-allowed; opacity: 0.5; }

    /* ---------- Segmented choices ---------- */
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .seg.seg-4 { grid-template-columns: repeat(4, 1fr); }
    .seg button {
      background: #fff;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 7px;
      padding: 5px 2px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      line-height: 1.2;
    }
    .seg button small { display: block; font-weight: 500; font-size: 9.5px; color: var(--muted); }
    .seg button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }

    .pane-note { margin: 4px 0 8px; font-size: 10.5px; line-height: 1.4; color: var(--muted); }

    @media (max-width: 640px) {
      .hud-panel { top: 8px; right: 8px; left: 8px; width: auto; max-height: 60vh; }
      .hud-panel.collapsed { left: auto; }
    }
    .stats-bar {
      position: absolute;
      left: 16px;
      bottom: 14px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 11px;
      color: #475569;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud-panel" id="hudPanel">
      <div class="hud-header">
        <div>
          <div class="hud-title">Física Bolsa HDPE</div>
          <div class="hud-subtitle">Lámina Delgada XPBD + Plasticidad</div>
        </div>
        <button class="toggle-btn" id="toggleHudBtn">Ocultar</button>
      </div>
      <div class="hud-body">
        <!-- Always visible: playback -->
        <div class="btn-row">
          <button class="action-btn primary" id="btnPause">Pausar (Espacio)</button>
          <button class="action-btn" id="btnRefPose" title="Vuelve a colgar la bolsa y genera de nuevo la pose de referencia con pliegues">Re-simular pose</button>
        </div>
        <div class="ctl" style="border-top:none; margin-top:6px"
             data-info="Guarda los últimos segundos de la simulación. <b>Arrástrala</b> para pausar y volver atrás; al <b>reanudar</b> se continúa desde ese instante y se descarta lo que venía después. Baja resolución guarda ~50 s; alta, ~14 s.">
          <div class="ctl-head">
            <label for="sliderTime">Línea de tiempo</label>
            <span class="ctl-val" id="valTime">—</span>
          </div>
          <input type="range" id="sliderTime" min="0" max="0" step="1" value="0" disabled data-plain />
        </div>

        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="sim">Simulación</button>
          <button type="button" role="tab" data-tab="mat">Material</button>
          <button type="button" role="tab" data-tab="wind">Viento</button>
          <button type="button" role="tab" data-tab="export">Exportar</button>
        </nav>

        <!-- ===== Simulación ===== -->
        <section class="tab-pane" data-tab="sim" role="tabpanel">
          <div class="ctl" data-info="Número de vértices de la malla. <b>Más vértices</b> = arrugas más finas y un STL más detallado, pero la simulación va más lenta. Cambiarla vuelve a generar la pose de referencia.">
            <div class="ctl-head"><span class="ctl-name">Resolución de malla</span></div>
            <div class="seg" id="resSeg">
              <button type="button" data-res="low" class="active">Baja<small>2,1k vért.</small></button>
              <button type="button" data-res="mid">Media<small>4,6k vért.</small></button>
              <button type="button" data-res="high">Alta<small>8,5k vért.</small></button>
            </div>
          </div>
          <div class="ctl" data-info="Qué asas quedan sujetas en el aire. Con <b>una sola</b>, la otra se suelta y pasa a ser parte de la simulación (cae, se balancea y se puede arrastrar). Con <b>ninguna</b>, la bolsa cae al suelo. Un asa que se vuelve a fijar queda sujeta donde esté en ese momento.">
            <div class="ctl-head"><span class="ctl-name">Asas fijas</span></div>
            <div class="seg seg-4" id="handleSeg">
              <button type="button" data-handles="both" class="active">Ambas</button>
              <button type="button" data-handles="left">Izquierda</button>
              <button type="button" data-handles="right">Derecha</button>
              <button type="button" data-handles="none">Ninguna</button>
            </div>
          </div>
          <div class="ctl" data-info="Ritmo del tiempo de la física. <b>&lt;1</b> = cámara lenta para ver cómo se forman los pliegues; <b>&gt;1</b> = más rápido. No cambia el material.">
            <div class="ctl-head"><label for="sliderSpeed">Velocidad</label></div>
            <input type="range" id="sliderSpeed" min="0.05" max="1.50" step="0.05" value="1.00" data-unit="×" />
          </div>
          <div class="ctl" data-info="Aceleración hacia abajo (Tierra = 9,8 m/s²). <b>Más</b> estira la bolsa desde las asas y tensa los pliegues; <b>0</b> = ingravidez.">
            <div class="ctl-head"><label for="sliderGravity">Gravedad</label></div>
            <input type="range" id="sliderGravity" min="0" max="18" step="0.2" value="9.8" data-unit="m/s²" />
          </div>
          <div class="ctl ctl-check" data-info="Impide que el plástico se atraviese a sí mismo al arrugarse. Desactivarla acelera la simulación, pero el STL puede tener caras cruzadas.">
            <div class="ctl-head"><label for="chkSelfCol">Autocolisión</label><input type="checkbox" id="chkSelfCol" checked /></div>
          </div>
          <div class="ctl ctl-check" data-info="Dibuja los triángulos de la malla física sobre la bolsa; útil para comparar resoluciones.">
            <div class="ctl-head"><label for="chkWireframe">Ver malla (wireframe)</label><input type="checkbox" id="chkWireframe" /></div>
          </div>

          <div class="section-title">Acciones</div>
          <div class="btn-row">
            <button class="action-btn" id="btnCrumple" title="Empuja todo el plástico hacia el centro y lo suelta, como si lo estrujaras">Arrugar y soltar</button>
            <button class="action-btn" id="btnShake" title="Un soplido corto de lado (para viento continuo, usa la pestaña Viento)">Ráfaga de aire</button>
          </div>
          <div class="btn-row">
            <button class="action-btn" id="btnFlat" title="Vuelve a la bolsa plana sin pliegues, colgada de las asas">Reiniciar plana</button>
            <button class="action-btn" id="btnWrinkleMode" title="Al arrastrar, pellizca y arruga la zona en vez de tirar de ella (también con Mayús + arrastrar)">Pincel arrugas: NO</button>
          </div>
        </section>

        <!-- ===== Material ===== -->
        <section class="tab-pane" data-tab="mat" role="tabpanel" hidden>
          <div class="ctl" data-info="Resistencia de la lámina a doblarse. <b>Bajo</b> = film fino de supermercado con muchas arrugas pequeñas; <b>alto</b> = plástico grueso que forma curvas suaves.">
            <div class="ctl-head"><label for="sliderBend">Rigidez de doblez</label></div>
            <input type="range" id="sliderBend" min="0.01" max="1.0" step="0.01" value="0.06" />
          </div>
          <div class="ctl" data-info="Plasticidad: cuánto de cada doblez queda fijado para siempre. <b>0</b> = elástico, recupera su forma; <b>1</b> = los pliegues quedan marcados como en una bolsa real.">
            <div class="ctl-head"><label for="sliderPlastic">Memoria de pliegues</label></div>
            <input type="range" id="sliderPlastic" min="0.0" max="1.0" step="0.02" value="0.88" />
          </div>
          <div class="ctl" data-info="Frenado aerodinámico sobre cada triángulo. <b>Alto</b> = la bolsa cae más despacio; <b>0</b> = cae como en el vacío. (Efecto todavía débil: se recalibrará con unidades físicas reales.)">
            <div class="ctl-head"><label for="sliderDrag">Resistencia del aire</label></div>
            <input type="range" id="sliderDrag" min="0.0" max="1.5" step="0.05" value="0.55" />
          </div>
          <div class="ctl" data-info="Aire atrapado en el cuerpo de la bolsa. <b>Positivo</b> la hincha y alisa las arrugas; <b>negativo</b> la desinfla. (Efecto todavía débil: se recalibrará con unidades físicas reales.)">
            <div class="ctl-head"><label for="sliderPressure">Presión interna</label></div>
            <input type="range" id="sliderPressure" min="-0.3" max="0.8" step="0.02" value="0.00" />
          </div>
        </section>

        <!-- ===== Viento ===== -->
        <section class="tab-pane" data-tab="wind" role="tabpanel" hidden>
          <div class="ctl" data-info="Velocidad del viento constante. <b>2–4 m/s</b> = brisa que mece la bolsa; <b>8–15 m/s</b> = viento fuerte que la levanta y la hace flamear. La flecha azul en la escena muestra hacia dónde sopla.">
            <div class="ctl-head"><label for="sliderWind">Velocidad</label><span class="ctl-hint" id="windSpeedHint"></span></div>
            <input type="range" id="sliderWind" min="0" max="15" step="0.5" value="0" data-unit="m/s" />
          </div>
          <div class="ctl" data-info="Hacia dónde sopla, visto desde la cámara inicial: <b>0°</b> = hacia la derecha, <b>90°</b> = hacia el fondo, <b>180°</b> = hacia la izquierda, <b>270°</b> = hacia la cámara.">
            <div class="ctl-head"><label for="sliderWindDir">Dirección</label><span class="ctl-hint" id="windDirHint"></span></div>
            <input type="range" id="sliderWindDir" min="0" max="355" step="5" value="0" data-unit="°" />
          </div>
          <div class="ctl" data-info="Ángulo respecto al suelo. <b>Positivo</b> = sopla hacia arriba y levanta la bolsa; <b>negativo</b> = sopla hacia abajo y la aplasta.">
            <div class="ctl-head"><label for="sliderWindElev">Inclinación</label></div>
            <input type="range" id="sliderWindElev" min="-60" max="60" step="5" value="0" data-unit="°" />
          </div>
          <div class="ctl" data-info="Cuánto varía el viento. <b>0</b> = flujo constante (la bolsa se queda quieta, inclinada); <b>alto</b> = ráfagas que cambian de fuerza y dirección y hacen flamear el plástico.">
            <div class="ctl-head"><label for="sliderWindTurb">Ráfagas</label></div>
            <input type="range" id="sliderWindTurb" min="0" max="1" step="0.05" value="0.4" />
          </div>
        </section>

        <!-- ===== Exportar ===== -->
        <section class="tab-pane" data-tab="export" role="tabpanel" hidden>
          <div class="ctl" data-info="El STL se exporta como sólido cerrado y reparado (sin auto-intersecciones ni aristas compartidas), con Z hacia arriba y reducido proporcionalmente para que ningún eje (X, Y, Z) supere <b>24 cm</b> en la placa. La reparación tarda 2–15 s según la resolución.">
            <div class="ctl-head"><span class="ctl-name">STL imprimible</span><span class="ctl-hint" style="margin-left:auto">máx. 24 cm por eje</span></div>
            <p class="pane-note">Pausa la simulación (Espacio) en el momento que quieras imprimir y descarga.</p>
            <button class="action-btn wide" id="btnDownloadStl" disabled title="Pausa la simulación (Espacio) para descargar el STL">Descargar STL</button>
          </div>
          <div class="ctl" data-info="Espesor real de la lámina en el STL, ya a escala de impresión. <b>1,2 mm</b> ≈ 3 perímetros con boquilla de 0,4; el mínimo (0,8 mm = 2 perímetros) evita paredes que el laminador no puede imprimir.">
            <div class="ctl-head"><label for="sliderWall">Grosor de pared</label></div>
            <input type="range" id="sliderWall" min="0.8" max="3" step="0.2" value="1.2" data-unit="mm" />
          </div>
          <div class="ctl ctl-check" data-info="Recorta unos mm del fondo redondeado y lo une a una placa plana de 2 mm. Sin base, la bolsa toca la cama en un solo punto y se despega o vuelca al imprimir.">
            <div class="ctl-head"><label for="chkBase">Base de apoyo</label><input type="checkbox" id="chkBase" checked /></div>
          </div>
        </section>
      </div>
    </div>
    <div class="stats-bar" id="statsBar">
      Arrastra la bolsa para tirar • Espacio: Pausar • Órbita: Arrastrar fuera • Zoom: Rueda
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
